name: GetAppMetadata
on:
   workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: microsoft/microsoft-store-apppublisher@v1.1
    - run: msstore reconfigure --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
    - name: Get Metadata
      shell: pwsh
      run: |
            $PSVersionTable
            msstore --version
            msstore submission get 9NP0T3QQXL70
            msstore submission status 9NV4GS32KHG2
            msstore submission status 0eea0e40-e7a3-4fe3-abb1-199ece696151
            msstore submission get 0eea0e40-e7a3-4fe3-abb1-199ece696151
